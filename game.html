    px(lx, ly + 2, 24, 6, '#2c3e50');
    px(lx + 7, ly - 8, 10, 10, '#2c3e50');
    px(lx + 9, ly - 6, 6, 6, Math.floor(time * 3) % 2 ? '#fff8b8' : '#ffe14a');
    ctx.globalAlpha = 0.25;
    px(lx - 40, ly - 10, 40, 8, '#fff8b8'); px(lx + 24, ly - 10, 40, 8, '#fff8b8');

    text('BARNEGAT LIGHT!', W / 2, 120, '#ffffff', 15, 'center', true);
  } else {
    drawLogo(W / 2, 60, 1.5);
    if (G.quit) {
      text('SHIFT OVER', W / 2, 100, '#8fd0e8', 14, 'center', true);
      text('YOU CLOCKED OUT EARLY', W / 2, 118, '#9aa7c5', 7, 'center');
    } else {
      text('YOUR CART MELTED...', W / 2, 100, '#ff6b9d', 14, 'center', true);
      text('THE MELT BAR RAN OUT', W / 2, 118, '#9aa7c5', 7, 'center');
    }
    text('MADE IT TO ' + CONFIG.TOWNS[G.townIdx].name, W / 2, 130, '#8fd0e8', 8, 'center');
  }

  // this run's three stats
  const m = Math.floor(G.runTime / 60), s = Math.floor(G.runTime % 60);
  px(28, 146, W - 56, 1, '#3a4668');
  text('SCORE ' + G.score, W / 2, 152, '#ffe14a', 14, 'center', true);
  if (G.newRecord && Math.floor(time * 3) % 2)
    text('NEW RECORD!', W / 2, 170, '#7ef9a8', 10, 'center', true);
  else if (G.rank >= 0)
    text('#' + (G.rank + 1) + ' ON THE BOARD', W / 2, 170, '#8fd0e8', 9, 'center', true);
  else
    text('DIDN\'T MAKE THE TOP TEN', W / 2, 170, '#5a6a8a', 7, 'center');
  text(G.delivered + ' SCOOPS  •  ' + streetLabel(Math.min(G.street, CONFIG.LAST_STREET))
       + '  •  ' + m + ':' + String(s).padStart(2, '0'), W / 2, 184, '#e8f4f8', 8, 'center');

  drawTopTen(202, G.rank);
  if (Math.floor(time * 2) % 2) text('- PRESS SPACE TO RUN AGAIN -', W / 2, 356, '#ffffff', 10, 'center', true);
}

// =====================================================================
//  Boss rendering
// =====================================================================
function drawSleepFace(x, y) {
  px(x - 1, y, 3, 1, '#141a2e'); px(x + 5, y, 3, 1, '#141a2e');   // closed eyes
}

function drawBoss() {
  const b = G.boss;
  if (!b) return;
  const asleep = b.state === 'sleeping';
  const bob = Math.sin(time * 3) * 2;

  if (b.idx === 0) {                                  // SEAGULL KING
    const x = b.x, y = b.y;
    ctx.globalAlpha = 0.25; px(x - 14, 420, 28, 5, '#3a2f1d'); ctx.globalAlpha = 1;  // ground shadow
    const flap = Math.floor(time * 8) % 2;
    px(x - 26, y - 4 + (flap ? 4 : -2), 12, 6, '#dfe6ea'); px(x + 14, y - 4 + (flap ? 4 : -2), 12, 6, '#dfe6ea');
    px(x - 14, y - 8, 28, 18, '#f4f7f9');             // body
    px(x - 10, y - 16, 20, 10, '#f4f7f9');            // head
    px(x - 4, y - 22, 8, 6, '#ffd700'); px(x - 6, y - 20, 12, 2, '#ffd700'); // crown
    if (asleep) drawSleepFace(x - 4, y - 13);
    else { px(x - 6, y - 14, 3, 3, '#141a2e'); px(x + 3, y - 14, 3, 3, '#141a2e'); }
    px(x - 3, y + 8, 6, 5, '#ff9a3c');                // beak = mouth
    px(x - 5, y + 10, 10, 3, '#e8802a');
  }

  if (b.idx === 1) {                                  // SANDCASTLE GOLEM
    const x = b.x;
    px(x - 26, 118, 52, 52, '#d9bd82');               // hulking body
    px(x - 30, 162, 60, 8, '#c9ad72');                // skirt of sand
    for (let i = -26; i < 26; i += 8) px(x + i, 112, 5, 6, '#d9bd82');  // crenellations
    px(x - 18, 126, 8, 8, asleep ? '#c9ad72' : '#2c3e50');  // eyes
    px(x + 10, 126, 8, 8, asleep ? '#c9ad72' : '#2c3e50');
    if (asleep) { drawSleepFace(x - 16, 130); drawSleepFace(x + 12, 130); }
    if (b.mouthOpen || asleep) { px(x - 9, 140, 18, 14, '#1a1206'); px(x - 7, 140, 14, 3, '#3a2f1d'); }
    else px(x - 9, 140, 18, 14, '#c9ad72');           // portcullis shut
    px(x - 34, 130, 8, 26, '#d9bd82'); px(x + 26, 130, 8, 26, '#d9bd82'); // arms
  }

  if (b.idx === 2) {                                  // SHELLFISH KRAKEN
    px(60, 78, 200, 30, '#8e4a6e');                   // body looming at the surf line
    px(70, 70, 180, 12, '#8e4a6e');
    px(100, 84, 10, 10, asleep ? '#6e3a56' : '#ffe14a'); px(210, 84, 10, 10, asleep ? '#6e3a56' : '#ffe14a');
    if (asleep) { drawSleepFace(100, 88); drawSleepFace(210, 88); }
    for (const [i, t] of b.tents.entries()) {
      const full = t.full >= CONFIG.BOSS_BELLY_CAPACITY / 3 - 0.5;
      for (let y = 108; y < 176; y += 6)              // wavy arm
        px(t.x + Math.sin(y * 0.08 + time * 2 + i) * 5 - 3, y, 7, 6, '#a55a80');
      px(t.x - 6, 176, 12, 12, full ? '#6e8a5a' : '#a55a80');   // tip
      px(t.x - 3, 180, 7, 5, full ? '#4a6a3a' : '#5e2a44');     // sucker mouth
      if (full) text('FULL', t.x, 162, '#9fd08a', 6, 'center', true);
    }
  }

  if (b.idx === 3) {                                  // MUTANT SURFER DUDE
    const x = b.x, y = b.y;
    ctx.globalAlpha = 0.5;                             // his personal wave
    px(30, y + 22, 260, 8, '#7dc4dd'); px(30, y + 20, 260, 3, '#eef7fa');
    ctx.globalAlpha = 1;
    px(x - 16, y + 14, 32, 6, '#ffe14a');             // board
    px(x - 5, y - 10, 12, 20, '#7ec850');             // gnarly green bod
    px(x - 4, y - 18, 10, 9, '#8ed860');              // head
    px(x - 14, y - 4, 9, 4, '#7ec850'); px(x + 7, y - 8, 9, 4, '#7ec850'); // arms out
    if (asleep) drawSleepFace(x - 2, y - 15);
    else { px(x - 2, y - 16, 2, 2, '#141a2e'); px(x + 2, y - 16, 2, 2, '#141a2e'); }
    px(x - 3, y - 6, 8, 6, '#1a1206');                // huge chill grin = mouth
  }

  if (b.idx === 4) {                                  // DEEP SEA DRAGON
    if (b.lunge !== 'hidden') {
      const hx = b.lx;
      for (let x = hx + 20; x < 310; x += 12)          // serpentine neck back to the sea
        px(x, 138 + Math.sin(x * 0.1 + time * 3) * 6, 12, 14, '#2a7a6a');
      px(hx - 16, 130, 34, 26, '#35937f');            // head
      px(hx - 22, 140, 10, 10, '#35937f');            // snout
      px(hx - 2, 124, 6, 8, '#ffe14a');               // eye
      if (asleep) drawSleepFace(hx - 2, 128); else px(hx, 126, 3, 4, '#141a2e');
      px(hx - 20, 148, 16, 8, '#0e3a30');             // mouth agape
      for (let i = 0; i < 3; i++) px(hx - 19 + i * 6, 148, 2, 3, '#ffffff'); // teeth
      px(hx - 10, 118, 5, 8, '#2a7a6a'); px(hx + 2, 114, 5, 12, '#2a7a6a'); // spines
    } else {
      const sx = 285;                                  // lurking shadow out in the deep
      ctx.globalAlpha = 0.4 + Math.sin(time * 6) * 0.2;
      px(sx - 18, 140, 40, 10, '#0e3a30');
      ctx.globalAlpha = 1;
      // wake marking where it will surface — the roam is telegraphed, not a coin flip
      const tx = b.lTarget;
      ctx.globalAlpha = 0.35 + Math.sin(time * 7) * 0.2;
      px(tx - 14, 150, 28, 2, '#0e3a30');
      px(tx - 9, 146, 18, 2, '#2a7a6a');
      px(tx - 9, 155, 18, 2, '#2a7a6a');
      ctx.globalAlpha = 1;
      if (Math.floor(time * 4) % 2) text('!', tx, 128, '#ff4757', 12, 'center', true);
    }
  }

  if (b.idx === 5) {                                  // FLOTSAM & BARNACLE
    // Old Barney watches from the dunes
    px(6, 96, 16, 40, '#f0e6d2'); px(7, 88, 14, 22, '#c0392b');
    px(4, 84, 20, 6, '#2c3e50'); px(9, 76, 10, 9, '#2c3e50');
    px(11, 78, 6, 5, Math.floor(time * 3) % 2 ? '#fff8b8' : '#ffe14a');
    const cols = [['#3fb8d4', '#2a8aa2', '#0e4a5a'], ['#ff6b9d', '#c2185b', '#5a0e2a']];
    for (const [i, h] of b.heads.entries()) {
      const C = cols[i], x = h.x, y = 128 + (i ? -bob : bob);
      for (let yy = y + 26; yy < 210; yy += 10)        // neck rising from the surf
        px(x - 8 + Math.sin(yy * 0.07 + time * 2 + i * 3) * 6, yy, 16, 10, C[1]);
      px(x - 16, y - 10, 32, 30, C[0]);               // head
      px(x - 20, y + 2, 8, 12, C[0]);                 // jaw
      px(x - 6 + (i ? 6 : 0), y - 4, 6, 8, '#ffe14a'); // eye
      if (asleep) drawSleepFace(x - 4 + (i ? 6 : 0), y - 1);
      else px(x - 4 + (i ? 6 : 0), y - 2, 3, 4, '#141a2e');
      px(x - 12, y + 12, 22, 9, C[2]);                // gaping mouth
      for (let k = 0; k < 4; k++) px(x - 11 + k * 6, y + 12, 2, 3, '#ffffff');
      for (let k = 0; k < 3; k++) px(x - 14 + k * 10, y - 14, 4, 6, C[1]); // spines
    }
  }

}

function drawBossAttack() {
  const b = G.boss;
  const a = b && b.atk;
  if (!a) return;
  const spec = CONFIG.BOSS_ATTACKS[b.idx] || {};
  const T = spec.telegraph || CONFIG.BOSS_ATK_TELEGRAPH;
  const k = Math.min(1, a.t / T);
  const striking = a.t >= T;

  if (a.kind === 'sweep') {                       // whole shoreline goes dangerous
    const x0 = CONFIG.DRY_END;
    ctx.globalAlpha = striking ? 0.8 : 0.18 + k * 0.32;
    for (let y = 40; y < H; y += 4)
      px(x0, y, W - x0, 3, striking ? '#eef7fa' : '#7dc4dd');
    ctx.globalAlpha = 1;
    if (!striking && Math.floor(time * 6) % 2)
      text('GET TO DRY SAND!', (x0 + W) / 2, 210, '#ff4757', 8, 'center', true);
    return;
  }

  if (a.kind === 'spit') {                        // brine glob arcs down at your mark
    const gx = a.sx + (a.x - a.sx) * k, gy = a.sy + (a.y - a.sy) * k;
    ctx.globalAlpha = 0.3;
    px(a.x - 10, a.y - 3, 20, 6, '#2a7a6a');      // landing mark
    ctx.globalAlpha = 1;
    if (!striking) {
      px(gx - 3, gy - 3, 7, 7, '#7ee8c0');
      px(gx - 1, gy - 3, 2, 2, '#ffffff');
    } else {
      for (let i = 0; i < 6; i++) {
        const ang = i * Math.PI / 3;
        px(a.x + Math.cos(ang) * 12 - 1, a.y + Math.sin(ang) * 7 - 1, 3, 3, '#7ee8c0');
      }
    }
    return;
  }

  // slam / bite: a shadow marks the ground, then it lands
  const r = 12 + k * (CONFIG.BOSS_ATK_RADIUS - 12);
  if (!striking) {
    ctx.globalAlpha = 0.25 + k * 0.35;
    px(a.x - r, a.y - 7, r * 2, 14, '#1a1206');
    ctx.globalAlpha = 1;
    if (Math.floor(time * 8) % 2) text('!', a.x, a.y - 28, '#ff4757', 12, 'center', true);
  } else {
    px(a.x - CONFIG.BOSS_ATK_RADIUS, a.y - 9, CONFIG.BOSS_ATK_RADIUS * 2, 18, '#ff4757');
    ctx.globalAlpha = 0.8;
    for (let i = 0; i < 7; i++)                   // sand kicked up by the impact
      px(a.x - 26 + i * 8, a.y - 16 - (i % 3) * 5, 3, 3, '#e8d29a');
    ctx.globalAlpha = 1;
  }
}

function drawBShots() {
  for (const s of G.bshots) {
    const k = Math.min(1, s.t / CONFIG.THROW_TIME);
    const x = s.x0 + (s.x1 - s.x0) * k;
    const y = s.y0 + (s.y1 - s.y0) * k;
    const size = 4 + Math.sin(Math.PI * k) * 3;       // arc reads as scale going up
    px(x - size / 2, y - size / 2, size, size, CONFIG.SCOOP_COLOR);
    px(x - 1, y - size / 2, 2, 2, '#ffffff');
  }
}

function drawCrate() {
  if (!G.crate || !G.boss) return;   // only exists inside a fight

  const c = G.crate, bob2 = Math.sin(c.t * 4) * 2;
  px(c.x - 10, c.y - 8 + bob2, 20, 16, '#c89858');
  px(c.x - 10, c.y - 8 + bob2, 20, 3, '#ff6b9d');
  px(c.x - 2, c.y - 6 + bob2, 4, 12, '#a5763e');
  if (Math.floor(time * 3) % 2) text('SCOOPS!', c.x, c.y - 22 + bob2, '#ffd6ec', 7, 'center', true);
}

function drawBossHUD() {
  const b = G.boss;
  if (!b) return;
  const CAP = CONFIG.BOSS_BELLY_CAPACITY;
  ctx.globalAlpha = 0.8; px(56, 40, 208, b.idx === 5 ? 30 : 26, '#141a2e'); ctx.globalAlpha = 1;
  px(56, 40, 208, 1, '#ff6b9d');
  text(b.name, W / 2, 43, '#ffe14a', 8, 'center', true);
  const frac = b.idx === 5 ? 0 : b.fullness / CAP;
  if (b.idx === 5) {
    const labels = ['FLOTSAM', 'BARNACLE'], colors = ['#3fb8d4', '#ff6b9d'];
    for (const [i, h] of b.heads.entries()) {
      const bx = 62 + i * 102;
      px(bx, 54, 96, 9, '#1a2138');
      if (h.sated) {
        px(bx, 54, 96, 9, Math.floor(time * 5) % 2 ? '#7ef9a8' : '#5ad488');
        text('SATED ' + Math.ceil(h.satedT), bx + 48, 55, '#0e3a20', 6, 'center', true);
      } else {
        px(bx, 54, Math.round(96 * h.fullness / CONFIG.BOSS_HEAD_CAPACITY), 9, colors[i]);
        text(labels[i], bx + 48, 55, '#ffffff', 6, 'center', true);
      }
    }
  } else {
    px(62, 54, 196, 9, '#1a2138');
    px(62, 54, Math.round(196 * frac), 9, frac > 0.85 ? '#7ef9a8' : '#ffa03c');
    text('BELLY', W / 2, 55, '#ffffff', 6, 'center', true);
  }
  // how-to hint until the first scoop lands
  if (b.state === 'fight' && !b.fed) {
    ctx.globalAlpha = 0.85; px(20, H - 60, W - 40, 30, '#141a2e'); ctx.globalAlpha = 1;
    px(20, H - 60, W - 40, 1, '#ffe14a');
    if (Math.floor(time * 2.5) % 2) {
      text('HOLD ← / → TO CHARGE A HIGH LOB!', W / 2, H - 55, '#ffe14a', 8, 'center', true);
      text('RUN UP (W) TO GET CLOSER — EASIER SHOT', W / 2, H - 42, '#ffffff', 7, 'center');
    } else {
      text('FILL THE BELLY TO PASS', W / 2, H - 55, '#7ef9a8', 8, 'center', true);
      text('LOW ON SCOOPS? A CRATE WILL WASH UP', W / 2, H - 42, '#ffd6ec', 7, 'center');
    }
  }
}

function render() {
  ctx.save();
  if (G.shakeT > 0 && state === 'RUN') {
    ctx.translate(Math.round((Math.random() - 0.5) * 2 * CONFIG.SHAKE_MAG),
                  Math.round((Math.random() - 0.5) * 2 * CONFIG.SHAKE_MAG));
  }
  drawTerrain();
  drawStreetsAndHubs();
  drawLandmarks();
  drawSplats();
  drawFootprints();
  drawSunbathers();
  drawHazards();
  if (state === 'RUN') { drawBoss(); drawBossAttack(); drawCrate(); drawPlayer(); drawCharge(); drawShots(); drawBShots(); }
  ctx.restore();
  if (state === 'RUN') { drawRushTint(); drawFloatersAndBanner(); drawHUD(); drawBossHUD(); }
  if (state === 'TITLE') drawTitle();
  if (state === 'GAMEOVER') drawEndScreen(false);
  if (state === 'WIN') drawEndScreen(true);
}

// =====================================================================
//  Fixed-timestep main loop
// =====================================================================
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
